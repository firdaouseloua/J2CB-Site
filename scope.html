<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Scientific scope | JC2B 2026</title>
    <meta name="theme-color" content="#061a2b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="scope">
    <header class="site-header" id="site-header"></header>
    <main>
      <section class="page-hero">
        <div class="container">
          <span class="eyebrow" data-i18n="scopeEyebrow">Thématiques scientifiques</span>
          <h1 data-i18n="scopeTitle">Des questions biologiques aux données, aux modèles et au calcul.</h1>
          <p data-i18n="scopeLead"></p>
        </div>
      </section>
      <section class="section section-soft">
        <div class="container scope-grid">
          <article class="scope-card">
            <div class="scope-icon">B</div>
            <h3 data-i18n="topicBioinfo">Bioinformatique</h3>
            <p data-i18n="topicBioinfoText"></p>
          </article>
          <article class="scope-card">
            <div class="scope-icon">S</div>
            <h3 data-i18n="topicBiostats">Biostatistiques</h3>
            <p data-i18n="topicBiostatsText"></p>
          </article>
          <article class="scope-card">
            <div class="scope-icon">C</div>
            <h3 data-i18n="topicCompBio">Biologie computationnelle</h3>
            <p data-i18n="topicCompBioText"></p>
          </article>
          <article class="scope-card">
            <div class="scope-icon">AI</div>
            <h3 data-i18n="topicAI">Intelligence artificielle</h3>
            <p data-i18n="topicAIText"></p>
          </article>
          <article class="scope-card">
            <div class="scope-icon">O</div>
            <h3 data-i18n="topicOmics">Génomique & omiques</h3>
            <p data-i18n="topicOmicsText"></p>
          </article>
          <article class="scope-card">
            <div class="scope-icon">D</div>
            <h3 data-i18n="topicData">Biomedical data science</h3>
            <p data-i18n="topicDataText"></p>
          </article>
        </div>
      </section>
      <section class="registration-band">
        <div class="container registration-band-inner">
          <div>
            <h2 data-i18n="scopeCtaTitle"></h2>
            <p data-i18n="scopeCtaText"></p>
          </div>
          <a class="btn btn-primary" href="registration.html" data-i18n="register">S'inscrire</a>
        </div>
      </section>
    </main>
    <footer class="site-footer" id="site-footer"></footer>
    <script src="js/site-config.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/app.js"></script>
    <script src="js/i18n.js"></script>
  </body>
</html>
